<!DOCTYPE html>
<meta charset="UTF-8" />
<html>

<head>
  <title>Serbia++</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/x-icon" href="/static/favicon.png">

  <!-- Bulma -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
  <link rel="stylesheet" href="static/index.css" />

  <!-- Leaflet (maps) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <!-- Select2 -->
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

  <!-- Scripts -->
  <script src="static/script.js"></script>
  <script src="static/mapLayers.js"></script>

  <script>
    let pics = {
      bg: "static/Pics/beograd.jpg",
      ns: "static/Pics/novi-sad.jpg",
      nis: "static/Pics/nis.jpg",
    };

    function changeBg(city) {
      document.body.style.backgroundImage = `url('${pics[city]}')`;
    }
  </script>
</head>

<body onload="toggleTable()">

  <section class="section">
    <div class="container">
      <h1 class="title has-text-centered">Serbia++</h1>

      <div class="box">
        <form id="myForm">
          <!-- Choosing a city -->
          <div class="field">
            <label class="label" for="city">City:</label>
            <div class="control">
              <div class="select is-fullwidth">
                <select id="city" name="city" onchange="onCityChange()"></select>
              </div>
            </div>
          </div>

          <!-- Choosing the type of search -->
          <div class="field">
            <label class="label" for="searchMode">Search type:</label>
            <div class="control">
              <div class="select is-fullwidth">
                <select id="searchMode" name="searchMode" onchange="onSearchModeChange()">
                  <option value="name">Station name</option>
                  <option value="coords">Location (need browser geolocation permission)</option>
                </select>
              </div>
            </div>
          </div>

          <!-- Name search -->
          <div class="name-search" style="display: none">
            <div class="field">
              <label class="label" for="name-input">Station name/ID:</label>
              <div class="control dropdown-container">
                <input type="text" id="name-input" class="input" placeholder="Enter station name..." autocomplete="off">
                <div id="dropdown" class="dropdown-menu"></div>
              </div>
            </div>
          </div>

          <!-- Search by coordinates -->
          <div class="coords-search" style="display: none">
            <div class="field">
              <label class="label" id="stationsMaxDistance-label">Distance (350m):</label>
              <div class="control">
                <input class="input" type="range" id="stationsMaxDistance-input" name="stationsMaxDistance-input"
                  min="50" max="1000" value="350" step="50" onchange="onRangeChange()" />
              </div>
            </div>

            <div class="field">
              <label class="label" for="coords-input">Station:</label>
              <div class="control">
                <div class="select is-fullwidth">
                  <select id="coords-input" onchange="toggleTable()"></select>
                </div>
              </div>
            </div>

            <!-- The send button -->
            <div class="field">
              <div class="control">
                <input id="submit" class="button is-primary is-fullwidth" type="submit" value="View buses" />
              </div>
            </div>
        </form>
      </div>

      <div id="result" class="box">
        <p id="stationName"></p>
        <p id="lastUpdated"></p>
        <p id="busRouteInfo"></p>
        <p id="error" class="has-text-danger" style="display: none">Error!</p>

        <div id="noBusesMessage" class="notification is-info">
          Currently, there are no buses scheduled to arrive at this stop.
        </div>

        <div id="tableContainer">
          <table id="tabela" class="table is-striped is-hoverable is-fullwidth">
            <thead id="thead">
              <tr>
                <th>#</th>
                <th>ETA</th>
                <th>Route</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>

        <div id="map" class="box mt-5"></div>
      </div>
    </div>
  </section>

</body>

</html>
