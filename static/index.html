<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>Serbia++</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.png" />
    <link rel="stylesheet" href="static/index.css" />

    <!-- Leaflet -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- App scripts -->
    <script src="static/script.js?v=bg-yellow-vehicles-2"></script>
    <script src="static/mapLayers.js"></script>

    <script>
      try {
        const theme = localStorage.getItem("theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
        }
      } catch {
        // Storage may be unavailable; CSS follows the system preference.
      }
    </script>
  </head>

  <body onload="toggleTable()">
    <main class="home-shell">
      <section class="search-card" aria-labelledby="appTitle">
        <button
          id="themeToggle"
          class="icon-button theme-toggle"
          type="button"
          aria-label="Toggle theme"
          title="Toggle theme"
        >
          <span aria-hidden="true">☼</span>
        </button>
        <header class="card-header">
          <h1 id="appTitle">Serbia++</h1>
          <p>Public transport in Serbia</p>
        </header>

        <form id="myForm">
          <div class="field">
            <label class="label" for="city">City</label>
            <div class="control select-control">
              <select id="city" name="city" onchange="onCityChange()"></select>
            </div>
          </div>

          <p id="chooseCityMessage" class="helper-text" style="display: none">
            Choose a city first.
          </p>
          <div id="stationControls">
            <div class="field">
              <label class="label" for="searchMode">Search type</label>
              <div class="control select-control">
                <select
                  id="searchMode"
                  name="searchMode"
                  onchange="onSearchModeChange()"
                >
                  <option value="name">Station name</option>
                  <option value="coords">Location</option>
                </select>
              </div>
            </div>

            <p
              id="searchLoading"
              class="helper-text"
              role="status"
              style="display: none"
            >
              Finding nearby stations…
            </p>
            <p
              id="searchError"
              class="error-text"
              role="alert"
              style="display: none"
            ></p>

            <div class="name-search" style="display: none">
              <div class="field">
                <label class="label" for="name-input">Station</label>
                <div class="control dropdown-container">
                  <input
                    type="search"
                    id="name-input"
                    class="input"
                    placeholder="Search stations"
                    autocomplete="off"
                    role="combobox"
                    aria-autocomplete="list"
                    aria-expanded="false"
                    aria-controls="dropdown"
                    aria-haspopup="listbox"
                  />
                  <div id="dropdown" role="listbox" aria-label="Stations"></div>
                  <p
                    id="dropdown-status"
                    class="helper-text"
                    role="status"
                    aria-live="polite"
                  ></p>
                </div>
              </div>
            </div>

            <div class="coords-search" style="display: none">
              <div class="field">
                <button
                  id="findNearby"
                  class="button button-primary full-width"
                  type="button"
                >
                  Find nearby stations
                </button>
              </div>
              <div class="field">
                <label
                  class="label"
                  id="stationsMaxDistance-label"
                  for="stationsMaxDistance-input"
                >
                  Maximum distance (350m)
                </label>
                <input
                  type="range"
                  id="stationsMaxDistance-input"
                  name="stationsMaxDistance-input"
                  min="50"
                  max="1000"
                  value="350"
                  step="50"
                  onchange="onRangeChange()"
                />
              </div>
              <div class="field">
                <label class="label" for="coords-input">Nearby station</label>
                <div class="control select-control">
                  <select id="coords-input" onchange="toggleTable()"></select>
                </div>
              </div>
              <div
                id="nearbyMap"
                class="nearby-map"
                style="display: none"
                role="region"
                aria-label="Nearby stations map"
              ></div>
              <div class="field">
                <input
                  id="submit"
                  class="button button-primary full-width"
                  type="submit"
                  value="When is my bus?"
                />
              </div>
            </div>
          </div>
        </form>
      </section>
    </main>

    <dialog
      id="arrivalsDialog"
      class="arrivals-dialog"
      aria-labelledby="dialogTitle"
    >
      <section class="dialog-card" id="result">
        <h2 id="dialogTitle" class="visually-hidden">Station arrivals</h2>
        <header class="dialog-header">
          <div>
            <h2
              id="stationName"
              class="station-name"
              style="display: none"
            ></h2>
            <p id="lastUpdated" class="status-text" style="display: none"></p>
          </div>
          <button
            id="closeArrivals"
            class="icon-button close-dialog"
            type="button"
            aria-label="Close arrivals"
            autofocus
          >
            <span aria-hidden="true">×</span>
          </button>
        </header>

        <p
          id="updateInProgress"
          class="status-text"
          role="status"
          aria-live="polite"
          style="display: none"
        >
          Updating…
        </p>
        <p id="busRouteInfo" class="status-text" style="display: none"></p>
        <p id="error" class="error-text" role="alert" style="display: none">
          Error!
        </p>

        <div id="noBusesMessage" class="empty-state" style="display: none">
          Currently, there are no buses scheduled to arrive at this stop.
        </div>

        <div id="tableContainer" style="display: none">
          <div class="table-scroll">
            <table id="tabela">
              <caption class="visually-hidden">
                Upcoming arrivals
              </caption>
              <thead id="thead">
                <tr>
                  <th scope="col">#</th>
                  <th scope="col">ETA</th>
                  <th scope="col">Route</th>
                </tr>
              </thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
        </div>

        <div id="scheduleSection" style="display: none">
          <hr class="divider" />
          <p id="scheduleInfo"></p>
          <div id="scheduleContainer"></div>
        </div>

        <div
          id="map"
          class="arrivals-map"
          role="region"
          aria-label="Map of stop and arrivals"
        ></div>
      </section>
    </dialog>
  </body>
</html>
