name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  checks:
    name: Check, lint, format, test, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.16.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify
