name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, format, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
